name: ci
on:
  push:
    branches: [main]
  pull_request:

# No secrets needed: tests mock every LLM, and the smoke test never calls one.
env:
  DATABASE_URL: sqlite:///./ci.db
  JWT_SECRET: ci-only-secret
  CHROMA_PERSIST_DIR: ./ci_chroma

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build # tsc -b && vite build

  smoke:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements-dev.txt && python -m playwright install --with-deps chromium
      - run: npm ci && npm run build
        working-directory: frontend
      - name: Start the single-service app (API at /api, UI at /)
        run: |
          alembic upgrade head
          nohup uvicorn app.serve:app --port 8000 > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/health && break; sleep 2; done
      - run: python -m pytest tests/e2e -q
        env:
          E2E_BASE_URL: http://127.0.0.1:8000
      - if: failure()
        run: cat server.log
