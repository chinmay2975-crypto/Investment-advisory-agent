# Deploys to a Hugging Face Space after CI passes on main (or when run by hand).
# One-time setup (see docs/DEPLOY.md):
#   repository secret   HF_TOKEN  = a Hugging Face token with "write" access
#   repository variable HF_SPACE  = <hf-username>/<space-name>, e.g. chinmay2975/investad
# The Space gets only what the Docker build needs (no screenshots or other binaries, which
# Spaces reject unless they're stored with Xet/LFS), in a single fresh commit each time.
name: deploy-hf
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ vars.HF_SPACE != '' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Assemble the Space
        run: |
          mkdir space
          cp -r app alembic alembic.ini requirements.txt Dockerfile .dockerignore space/
          rsync -a --exclude node_modules --exclude dist --exclude tsconfig.tsbuildinfo frontend/ space/frontend/
          find space -name "__pycache__" -prune -exec rm -rf {} +
          cat > space/README.md <<'MD'
          ---
          title: InvestAd
          emoji: 📈
          colorFrom: blue
          colorTo: green
          sdk: docker
          app_port: 8000
          pinned: false
          short_description: Country-aware investment advisory agent
          ---

          Deployed automatically from GitHub. General information only, not licensed financial advice.
          MD
          sed -i 's/^          //' space/README.md
      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          cd space
          git init -q -b main
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7} from GitHub"
          git push --force "https://hf:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
