# Free Supabase projects pause after 7 days without activity. This pings an endpoint that runs a
# real query, every 3 days. Set the repository variable APP_URL (Settings > Secrets and variables >
# Actions > Variables), e.g. https://investad.onrender.com. Without it the job is a no-op.
name: keep-alive
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping deep health check
        if: ${{ vars.APP_URL != '' }}
        run: |
          for i in 1 2 3 4 5; do
            curl -sf --max-time 90 "${{ vars.APP_URL }}/api/health/deep" && exit 0
            echo "attempt $i failed (service may be waking up)"; sleep 30
          done
          exit 1
